<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>சாயின் அற்புத கதைகள் | Sai Baba Miracles in Tamil</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=Noto+Sans+Tamil:wght@300;400;500;600;700&family=Noto+Serif+Tamil:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════
   ROOT & RESET
════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#D4AF37;--gold-lt:#FFD700;--gold-pale:#FFF8DC;
  --saffron:#FF8C00;--saffron-lt:#FFA040;
  --deep:#0A0500;--dark:#100800;--dark2:#1A0D00;
  --card:#120800;--card2:#1E1000;
  --cream:#FFF5E1;--cream2:#FFE8B0;
  --text:#F5E6C8;--text-dim:rgba(245,230,200,0.6);
  --border:rgba(212,175,55,0.22);
  --border-bright:rgba(212,175,55,0.55);
  --cat-color:#FF8C00;
}

html{
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}

body{
  background:var(--deep);
  font-family:'Noto Sans Tamil','Noto Serif Tamil',sans-serif;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* ════════════════════════════════════
   CANVAS — fixed bg particles
════════════════════════════════════ */
#bg-canvas{
  position:fixed;inset:0;
  width:100%;height:100%;
  pointer-events:none;z-index:0;
}

/* ════════════════════════════════════
   GRADIENT BG
════════════════════════════════════ */
.bg-layer{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(212,175,55,0.12) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 0% 100%,rgba(255,140,0,0.07) 0%,transparent 55%),
    radial-gradient(ellipse 60% 40% at 100% 100%,rgba(180,80,0,0.06) 0%,transparent 55%),
    linear-gradient(180deg,#0A0500 0%,#120800 50%,#0A0500 100%);
}

/* ════════════════════════════════════
   BACK BUTTON
════════════════════════════════════ */
#back-btn{
  position:fixed;top:14px;left:14px;z-index:200;
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:24px;
  border:1px solid rgba(212,175,55,0.35);
  background:rgba(10,5,0,0.85);
  color:var(--gold);
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;
  cursor:pointer;text-decoration:none;
  backdrop-filter:blur(8px);
  transition:all .25s;
  -webkit-tap-highlight-color:transparent;
}
#back-btn:hover{border-color:var(--gold-lt);box-shadow:0 0 16px rgba(212,175,55,0.3);}

/* ════════════════════════════════════
   MUSIC CONTROLS — fixed top right
════════════════════════════════════ */
#music-ctrl{
  position:fixed;top:14px;right:14px;z-index:200;
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:24px;
  border:1px solid rgba(212,175,55,0.30);
  background:rgba(10,5,0,0.85);
  backdrop-filter:blur(8px);
  transition:all .25s;
}
#music-toggle{
  background:none;border:1px solid rgba(212,175,55,0.4);
  border-radius:50%;width:28px;height:28px;
  cursor:pointer;font-size:11px;
  color:var(--gold-lt);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;-webkit-tap-highlight-color:transparent;
}
#music-toggle:hover{background:rgba(212,175,55,0.15);}
#music-label{
  font-family:'Cinzel',serif;font-size:9px;
  letter-spacing:1px;color:rgba(212,175,55,0.6);
  white-space:nowrap;
}
.music-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--gold-lt);
  box-shadow:0 0 6px rgba(255,215,0,.8);
  animation:dotPulse 1.4s ease-in-out infinite;
  display:none;
}
@keyframes dotPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

/* ════════════════════════════════════
   HEADER
════════════════════════════════════ */
#page-header{
  position:relative;z-index:10;
  text-align:center;
  padding:70px 20px 30px;
}
.om-symbol{
  font-family:'Noto Serif Tamil',serif;
  font-size:clamp(2rem,8vw,3.5rem);
  color:var(--gold-lt);
  display:block;margin-bottom:8px;
  filter:drop-shadow(0 0 20px rgba(255,215,0,.7));
  animation:omGlow 4s ease-in-out infinite;
}
@keyframes omGlow{
  0%,100%{filter:drop-shadow(0 0 15px rgba(255,215,0,.5));}
  50%{filter:drop-shadow(0 0 35px rgba(255,215,0,1)) drop-shadow(0 0 60px rgba(212,175,55,.4));}
}
.page-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.2rem,5vw,2.2rem);
  font-weight:900;letter-spacing:3px;
  background:linear-gradient(180deg,#FFF8E1 0%,#FFD700 30%,#D4AF37 60%,#FFD700 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 14px rgba(212,175,55,.7));
  margin-bottom:6px;
}
.page-subtitle{
  font-family:'Noto Serif Tamil',serif;
  font-size:clamp(1rem,3.5vw,1.3rem);
  color:var(--saffron);letter-spacing:2px;opacity:.85;
  margin-bottom:10px;
}
.header-divider{
  display:flex;align-items:center;gap:12px;
  max-width:360px;margin:12px auto;
}
.hdiv-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.hdiv-gem{color:var(--gold-lt);font-size:11px;letter-spacing:6px;opacity:.8;}
.story-count-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(212,175,55,0.1);
  border:1px solid rgba(212,175,55,0.3);
  border-radius:20px;padding:5px 16px;
  font-size:11px;letter-spacing:1.5px;
  color:rgba(212,175,55,0.75);
  margin-top:6px;
}

/* ════════════════════════════════════
   SEARCH & FILTER
════════════════════════════════════ */
#controls-bar{
  position:sticky;top:0;z-index:100;
  background:rgba(8,4,0,0.92);
  border-bottom:1px solid rgba(212,175,55,0.12);
  backdrop-filter:blur(14px);
  padding:12px 16px;
}
.search-wrap{
  max-width:600px;margin:0 auto 10px;
  position:relative;
}
#search-input{
  width:100%;
  background:rgba(20,10,0,0.8);
  border:1px solid rgba(212,175,55,0.28);
  border-radius:10px;
  color:var(--cream);
  font-family:'Noto Sans Tamil',sans-serif;
  font-size:14px;padding:10px 40px 10px 14px;
  outline:none;transition:border-color .3s,box-shadow .3s;
}
#search-input::placeholder{color:rgba(212,175,55,0.35);}
#search-input:focus{border-color:rgba(212,175,55,0.55);box-shadow:0 0 16px rgba(212,175,55,.1);}
.search-icon{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:rgba(212,175,55,0.45);font-size:14px;pointer-events:none;
}
.cat-scroll{
  display:flex;gap:6px;overflow-x:auto;
  max-width:600px;margin:0 auto;
  padding-bottom:2px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-btn{
  flex-shrink:0;
  background:rgba(20,10,0,0.7);
  border:1px solid rgba(212,175,55,0.2);
  border-radius:20px;
  color:rgba(212,175,55,0.6);
  font-family:'Noto Sans Tamil',sans-serif;
  font-size:12px;padding:5px 13px;
  cursor:pointer;transition:all .2s;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.cat-btn:hover,.cat-btn.active{
  background:rgba(212,175,55,0.16);
  border-color:var(--gold);color:var(--gold-lt);
}

/* ════════════════════════════════════
   STORY COUNT DISPLAY
════════════════════════════════════ */
#results-info{
  text-align:center;
  padding:10px 16px 2px;
  font-size:11px;letter-spacing:1px;
  color:rgba(212,175,55,0.4);
  position:relative;z-index:5;
}

/* ════════════════════════════════════
   STORIES GRID
════════════════════════════════════ */
#stories-container{
  position:relative;z-index:5;
  max-width:900px;margin:0 auto;
  padding:10px 14px 100px;
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
}
@media(min-width:640px){#stories-container{grid-template-columns:1fr 1fr;}}
@media(min-width:900px){#stories-container{grid-template-columns:repeat(3,1fr);}}

/* ════════════════════════════════════
   STORY CARD
════════════════════════════════════ */
.story-card{
  background:linear-gradient(145deg,rgba(26,13,0,0.92),rgba(18,8,0,0.95));
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease;
  position:relative;
  -webkit-tap-highlight-color:transparent;
  will-change:transform;
}
.story-card::before{
  content:'';position:absolute;inset:0;border-radius:18px;
  background:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,0.09) 0%,transparent 65%);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.story-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(0,0,0,0.5),0 0 30px rgba(212,175,55,0.18);
  border-color:var(--border-bright);
}
.story-card:hover::before{opacity:1;}
.story-card:active{transform:scale(.98);}

/* Card shimmer */
.story-card::after{
  content:'';position:absolute;top:0;left:-120%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent);
  transform:skewX(-20deg);
  animation:cardShim 6s ease-in-out infinite;
  animation-delay:var(--cd,0s);
}
@keyframes cardShim{0%{left:-120%}30%,100%{left:160%}}

/* Category tag */
.card-cat{
  display:flex;align-items:center;gap:6px;
  padding:10px 14px 6px;
}
.cat-tag{
  font-size:10px;letter-spacing:1.2px;
  color:var(--saffron);
  background:rgba(255,140,0,0.1);
  border:1px solid rgba(255,140,0,0.2);
  border-radius:12px;padding:3px 10px;
  font-family:'Noto Sans Tamil',sans-serif;
}
.card-num{
  margin-left:auto;
  font-size:10px;color:rgba(212,175,55,0.3);
  font-family:'Cinzel',serif;letter-spacing:1px;
}

/* Card title */
.card-title{
  font-family:'Noto Serif Tamil',serif;
  font-size:clamp(13px,3.5vw,16px);
  font-weight:700;
  color:var(--cream);
  padding:4px 14px 8px;
  line-height:1.45;
}

/* Story preview */
.card-preview{
  font-family:'Noto Sans Tamil',sans-serif;
  font-size:12px;line-height:1.75;
  color:var(--text-dim);
  padding:0 14px 10px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

/* Location & devotee strip */
.card-meta{
  padding:8px 14px 12px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.meta-loc{
  font-size:10px;color:rgba(212,175,55,0.5);
  letter-spacing:.5px;display:flex;align-items:center;gap:3px;
}
.meta-read{
  margin-left:auto;
  font-size:10px;letter-spacing:1px;
  color:rgba(212,175,55,0.5);
  border:1px solid rgba(212,175,55,0.2);
  border-radius:12px;padding:3px 10px;
  font-family:'Cinzel',serif;
  transition:all .2s;
}
.story-card:hover .meta-read{
  color:var(--gold-lt);border-color:rgba(212,175,55,0.45);
}

/* Tags */
.card-tags{
  padding:0 14px 12px;display:flex;gap:4px;flex-wrap:wrap;
}
.tag{
  font-size:10px;
  background:rgba(212,175,55,0.07);
  border:1px solid rgba(212,175,55,0.14);
  border-radius:10px;padding:2px 8px;
  color:rgba(212,175,55,0.5);
  font-family:'Noto Sans Tamil',sans-serif;
}

/* Divider inside card */
.card-divider{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,0.12),transparent);
  margin:0 14px;
}

/* ════════════════════════════════════
   STORY MODAL (full screen reader)
════════════════════════════════════ */
#story-modal{
  position:fixed;inset:0;z-index:500;
  display:none;
  flex-direction:column;
  background:linear-gradient(180deg,#0A0500 0%,#120900 60%,#0A0500 100%);
  overflow:hidden;
}
#story-modal.open{display:flex;}

/* Modal header */
#modal-header{
  position:relative;
  padding:16px 20px 14px;
  border-bottom:1px solid rgba(212,175,55,0.14);
  background:rgba(8,4,0,0.92);
  backdrop-filter:blur(10px);
  flex-shrink:0;
}
#modal-close{
  position:absolute;top:14px;right:16px;
  background:rgba(212,175,55,0.08);
  border:1px solid rgba(212,175,55,0.25);
  border-radius:50%;width:34px;height:34px;
  cursor:pointer;font-size:14px;color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;-webkit-tap-highlight-color:transparent;
}
#modal-close:hover{background:rgba(212,175,55,0.18);}
#modal-cat-tag{
  font-size:10px;letter-spacing:1.5px;
  color:var(--saffron);
  background:rgba(255,140,0,0.1);
  border:1px solid rgba(255,140,0,0.2);
  border-radius:12px;padding:3px 12px;
  display:inline-block;margin-bottom:6px;
  font-family:'Noto Sans Tamil',sans-serif;
}
#modal-title{
  font-family:'Noto Serif Tamil',serif;
  font-size:clamp(15px,4.5vw,22px);
  font-weight:700;color:var(--cream);
  padding-right:44px;line-height:1.4;
}
#modal-meta-row{
  display:flex;align-items:center;gap:8px;
  margin-top:6px;flex-wrap:wrap;
}
.m-loc,.m-dev{
  font-size:10px;color:rgba(212,175,55,0.45);
  letter-spacing:.5px;display:flex;align-items:center;gap:3px;
}
#modal-progress-bar{
  position:absolute;bottom:0;left:0;height:2px;
  background:linear-gradient(90deg,var(--saffron),var(--gold-lt));
  width:0%;transition:width .3s;border-radius:0 2px 2px 0;
}

/* Modal scroll area */
#modal-body{
  flex:1;overflow-y:auto;
  padding:24px 20px 40px;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
/* Custom scrollbar */
#modal-body::-webkit-scrollbar{width:4px;}
#modal-body::-webkit-scrollbar-track{background:rgba(212,175,55,0.03);}
#modal-body::-webkit-scrollbar-thumb{background:rgba(212,175,55,0.2);border-radius:2px;}

/* Om symbol in modal */
.modal-om{
  text-align:center;font-size:2rem;
  color:var(--gold-lt);display:block;margin-bottom:16px;
  filter:drop-shadow(0 0 15px rgba(255,215,0,.6));
  animation:omGlow 4s ease-in-out infinite;
}

/* Story text */
#modal-story-text{
  font-family:'Noto Serif Tamil',serif;
  font-size:clamp(14px,4vw,17px);
  line-height:2.1;
  color:var(--cream);
  letter-spacing:.02em;
  text-align:justify;
}

/* Reading divider */
.modal-divider{
  display:flex;align-items:center;gap:12px;
  margin:28px 0;
}
.modal-div-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,0.22),transparent);}
.modal-div-sym{color:var(--gold);font-size:14px;opacity:.6;}

/* Tamil quote box */
#modal-quote-box{
  background:linear-gradient(135deg,rgba(30,15,0,0.9),rgba(15,7,0,0.95));
  border:1px solid rgba(212,175,55,0.3);
  border-left:3px solid var(--saffron);
  border-radius:0 14px 14px 0;
  padding:18px 20px;
  margin:20px 0;
  position:relative;
  overflow:hidden;
}
#modal-quote-box::before{
  content:'“';
  position:absolute;top:-12px;left:10px;
  font-size:5rem;color:rgba(212,175,55,0.08);
  font-family:Georgia,serif;line-height:1;pointer-events:none;
}
.quote-label{
  font-size:9px;letter-spacing:2px;color:var(--saffron);
  opacity:.7;margin-bottom:8px;
  font-family:'Cinzel',serif;
}
#modal-quote-text{
  font-family:'Noto Serif Tamil',serif;
  font-size:clamp(13px,3.8vw,16px);
  line-height:1.85;
  color:var(--cream2);
  font-style:italic;
  letter-spacing:.02em;
}
.quote-source{
  margin-top:8px;
  font-size:11px;color:rgba(212,175,55,0.4);
  text-align:right;letter-spacing:.5px;
}

/* Nav buttons in modal */
#modal-nav{
  display:flex;gap:10px;
  padding:14px 20px 20px;
  border-top:1px solid rgba(212,175,55,0.1);
  background:rgba(8,4,0,0.88);
  backdrop-filter:blur(8px);
  flex-shrink:0;
}
.mnav-btn{
  flex:1;padding:12px 10px;
  border-radius:12px;
  border:1px solid rgba(212,175,55,0.25);
  background:rgba(20,10,0,0.8);
  color:var(--gold);
  font-family:'Noto Sans Tamil',sans-serif;
  font-size:13px;letter-spacing:.5px;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:6px;
  -webkit-tap-highlight-color:transparent;
}
.mnav-btn:hover{background:rgba(212,175,55,0.12);border-color:var(--gold);}
.mnav-btn:disabled{opacity:.3;cursor:not-allowed;}

/* ════════════════════════════════════
   DIYA FLAME DECORATION
════════════════════════════════════ */
.diya-accent{
  text-align:center;padding:16px 0 6px;
  font-size:1.8rem;
  animation:diyaFlick .7s ease-in-out infinite alternate;
}
@keyframes diyaFlick{
  0%{filter:drop-shadow(0 0 8px rgba(255,140,0,.7)) brightness(1);}
  100%{filter:drop-shadow(0 0 16px rgba(255,200,0,.9)) brightness(1.2);}
}

/* ════════════════════════════════════
   EMPTY STATE
════════════════════════════════════ */
#empty-state{
  display:none;
  grid-column:1/-1;
  text-align:center;padding:60px 20px;
  color:rgba(212,175,55,0.35);
}
#empty-state .empty-icon{font-size:3rem;display:block;margin-bottom:12px;opacity:.5;}
#empty-state p{font-family:'Noto Sans Tamil',sans-serif;font-size:14px;letter-spacing:.5px;}

/* ════════════════════════════════════
   SCROLL TO TOP
════════════════════════════════════ */
#scroll-top{
  position:fixed;bottom:80px;right:16px;z-index:150;
  width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(212,175,55,0.3);
  background:rgba(10,5,0,0.85);
  color:var(--gold);font-size:16px;
  cursor:pointer;display:none;
  align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
  transition:all .3s;-webkit-tap-highlight-color:transparent;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
}
#scroll-top.visible{display:flex;}
#scroll-top:hover{box-shadow:0 0 20px rgba(212,175,55,0.3);}

/* ════════════════════════════════════
   OM FOOTER
════════════════════════════════════ */
#page-footer{
  position:relative;z-index:5;
  text-align:center;
  padding:20px 16px 30px;
  border-top:1px solid rgba(212,175,55,0.1);
}
.footer-om{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(14px,4vw,22px);font-weight:900;letter-spacing:4px;
  background:linear-gradient(180deg,#FFFDE7 0%,#FFD700 30%,#D4AF37 60%,#FFD700 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 8px rgba(255,215,0,.6));
  animation:omGlow 3.5s ease-in-out infinite;
}
.footer-sub{font-size:10px;color:rgba(212,175,55,0.3);letter-spacing:4px;margin-top:5px;}

/* ════════════════════════════════════
   READING MUSIC INDICATOR
════════════════════════════════════ */
#reading-music-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  display:none;
  align-items:center;gap:10px;
  padding:10px 18px;
  background:rgba(6,3,0,0.95);
  border-top:1px solid rgba(212,175,55,0.18);
  backdrop-filter:blur(12px);
}
#reading-music-bar.visible{display:flex;}
.rmb-icon{font-size:16px;animation:diyaFlick .7s ease-in-out infinite alternate;}
.rmb-text{
  font-family:'Noto Sans Tamil',sans-serif;
  font-size:11px;color:rgba(212,175,55,0.7);letter-spacing:.5px;flex:1;
}

 30, "title": "குழந்தை நஞ்சிலிருந்து பிழைத்தது", "category": "உயிர் காத்தல்", "story": "அகமதுநகரில் ஊர்மிளாவின் 3 வயது மகள் கொசு கொல்லி திரவம் குடித்தாள். மயக்கம். மருத்துவமனை போகும் வழியில் 'சாய்பாபா, என் குழந்தை' என்று கதறினாள். ICU-வில் 36 மணி நேரம். குழந்தை கண் திறந்து 'அம்மா' என்று கூவியது. 'இந்த அளவு நஞ்சு 3 வயது குழந்தைக்கு இந்த recovery நான் 25 ஆண்டில் பார்த்ததில்லை' என்று மருத்துவர் கூறினார்.", "devotee": "ஊர்மிளா", "location": "அகமதுநகர்", "tamil_quote": "\"என்னை நம்பிக்கையோடு அழைத்தால், கடல் நடுவிலும் நான் கரை காட்டுவேன்.\" — சாய்பாபா", "tags": ["நஞ்சு", "குழந்தை", "ICU", "காப்பு", "தாயார்"]}, {"id": 31, "title": "விவாகரத்துக்கு பின் புது வாழ்க்கை", "category": "வாழ்க்கை அற்புதம்", "story": "நாசிக்கில் சுமித்ரா விவாகரத்துக்கு பின் இரண்டு குழந்தைகளுடன் தனியாக ஆனாள். வேலை இல்லை. சிர்டியில் ஒரு வாரம் தங்கினாள். ஒரு மூதாட்டி 'பாபா உன்னை விடமாட்டார்' என்று கூறினாள். school-ல் teacher post-க்கு apply செய்தாள். Principal 'கனவில் ஒரு முதியவர் ஒரு பெண்ணை refer பண்ணினார், நீங்கதான்' என்று வேலை கொடுத்தார். இன்று senior teacher. குழந்தைகள் நல்லா படிக்கிறார்கள்.", "devotee": "சுமித்ரா", "location": "நாசிக்", "tamil_quote": "\"இழப்பு என்பது இறைவன் கொடுக்கும் திருப்பம்; புதிய வாழ்வின் வாயில்.\" — சாய் ஞானம்", "tags": ["விவாகரத்து", "teacher", "குழந்தை", "கனவு", "புது வாழ்க்கை"]}, {"id": 32, "title": "Medical college admission", "category": "கல்வி", "story": "ஹைதராபாத்தில் ஸ்ரீதேவி NEET எழுதினாள். Waitlist 47வது இடம். அப்பா 6 வியாழன் விரதம் இருந்தார். Counselling rounds முடியும்போது 46 பேரும் வேற கல்லூரி தேர்வு செய்ய ஸ்ரீதேவிக்கு government seat வந்தது. அப்பா அழுதார். 'பாபா இடம் கொடுத்தார்' என்று குடும்பம் மகிழ்ந்தது.", "devotee": "ஸ்ரீதேவி", "location": "ஹைதராபாத்", "tamil_quote": "\"தந்தையின் கனவு மகனின் கடமை; இறைவன் அந்த கடமைக்கு துணை நிற்பான்.\" — தமிழ் மரபு", "tags": ["MBBS", "NEET", "waitlist", "admission", "அப்பா"]}, {"id": 33, "title": "பொய் வழக்கிலிருந்து விடுதலை", "category": "வாழ்க்கை அற்புதம்", "story": "மும்பையில் சரோஜாவின் கணவன் பொய் வழக்கில் சிறையில். மனைவ itle": "கண் அறுவை வெற்றி", "category": "உடல் நலம்", "story": "பெங்களூரில் சரோஜினியின் கணவருக்கு கண் அறுவை. மனைவி வெளியே சாய்பாபா படம் ஏந்தி பிரார்த்தனை செய்தாள். அறுவை நேர்த்தியாக நடந்தது. '20 ஆண்டுகளில் இவ்வளவு சுமுகமாக ஒரு ஆபரேஷன் செய்ததில்லை' என்று மருத்துவர் கூறினார்.", "devotee": "சரோஜினி", "location": "பெங்களூரு", "tamil_quote": "\"துயரம் வரும்போது சாய்யை நினை; அன்பர்க்கு அவன் நிழல் போல் நிற்பான்.\" — பாபா அருளுரை", "tags": ["கண்", "அறுவை", "வெற்றி", "மனைவி", "மருத்துவர்"]}, {"id": 85, "title": "தவறான பாதையிலிருந்து மீட்சி", "category": "வாழ்க்கை அற்புதம்", "story": "மும்பையில் ராஜேஷ் திருட்டு வழியில் சென்றான். ஒரு வீட்டில் திருடும்போது சாய்பாபா படத்தின் முன் நின்றான். அந்த கண்கள் தன்னை பார்க்கின்றன என்று உணர்ந்தான். கால் நடுங்கியது. பொருட்களை வைத்துவிட்டு ஓடினான். மனம் மாறி நல்வழியில் வந்தான். இன்று சமூக சேவகன்.", "devotee": "ராஜேஷ்", "location": "மும்பை", "tamil_quote": "\"வாழ்க்கையில் பாதை மறைந்தாலும் சாய் ஒளி மறைவதில்லை.\" — தமிழ் பக்தர் வாக்கு", "tags": ["திருட்டு", "மனம் மாற்றம்", "நல்வழி", "சேவை", "படம்"]}, {"id": 86, "title": "வெளிநாட்டில் நட்பு கிடைத்தது", "category": "வாழ்க்கை அற்புதம்", "story": "அமெரிக்காவில் ப்ரவீண் கடும் தனிமையால் துவண்டான். 'ஒரு நண்பனை கொடு' என்று வேண்டினான். மறுநாள் அலுவலகத்தில் ஒருவர் 'நீங்கள் சாய்பாபா பக்தரா?' என்று கேட்டார். அவரும் பக்தர். ஆழமான நட்பு ஆனது. பல நண்பர்கள் கிடைத்தனர்.", "devotee": "ப்ரவீண்", "location": "அமெரிக்கா", "tamil_quote": "\"இழப்பு என்பது இறைவன் கொடுக்கும் திருப்பம்; புதிய வாழ்வின் வாயில்.\" — சாய் ஞானம்", "tags": ["தனிமை", "நட்பு", "வெளிநாடு", "பக்தர்", "அருள்"]}, {"id": 87, "title": "மூட்டு மாற்று தேவையில்லை", "category": "உடல் நலம்", "story": "வேலூரில் கோவிந்தம்மாளுக்கு மூட்டு மாற்று அறுவை வேண்டும் என்றனர். வயதினால் ஆபத்து. குடும்பம் 6 வியாழன் விரதம். 6வது வியாழன் மூட்டு நிலை கணிசமாக மேம்பட்டிருந்தது. மாற்று அறுவை தேவையில்லை. உடற்பயிற்சி மட்டும் பரிந்துரைத்தனர்.", "devotee": "கோவிந்தம்மாள்", "location": "வேலூர்", "tamil_quote": "\"உடலை இறைவன் கட்டினான்; உயிரை அவனே காக்கிறான் — நாம் வெறும் நிமித்தம். யானது; பாபாவின் கருணை என்பது அமிர்தத்தை விட இனிமையானது.\" — சாய் வாக்கு", "tags": ["ஆயுள்", "நோய்", "சாந்தி", "இறுதி காலம்", "குடும்பம்"]}, {"id": 92, "title": "அனாதை ஆசிரமத்திற்கு உதவி", "category": "சேவை அற்புதம்", "story": "நாசிக்கில் சாய்சேவா ஆசிரமம் நடத்தும் பக்தருக்கு உணவு பஞ்சம். பாபாவிடம் அழுதார். அன்று மாலையே ஒரு தம்பதியர் 'கனவில் ஒரு முதியவர் இங்கு வரச் சொன்னார்' என்று பெரிய தொகை நன்கொடை கொடுத்தனர். குழந்தைகளுக்கு உணவு கிடைத்தது.", "devotee": "சாய்சேவா ஆசிரமம்", "location": "நாசிக்", "tamil_quote": "\"ஒருவனுக்கு கொடு என்று இறைவன் சொல்கிறான்; நாம் கொடுக்கும்போது இறைவனுக்கே கொடுக்கிறோம்.\" — சாய் வாக்கு", "tags": ["அனாதை", "ஆசிரமம்", "நன்கொடை", "கனவு", "சேவை"]}, {"id": 93, "title": "சக்கர நாற்காலியிலிருந்து நடை", "category": "உடல் நலம்", "story": "சிர்டியில் ஹேமலதா 5 ஆண்டு சக்கர நாற்காலியில் இருந்தாள். சமாதி மந்திரத்தில் திடீரென்று கால்களில் சுடு உணர்வு ஏற்பட்டது. கையால் ஆதாரம் எடுத்து எழுந்தாள். சில அடிகள் நடந்தாள். மக்கள் அழுது மகிழ்ந்தனர்.", "devotee": "ஹேமலதா", "location": "சிர்டி", "tamil_quote": "\"உடல் நோயை மருத்துவர் குணப்படுத்துகிறார்; ஆன்மா நோயை இறைவன் மட்டுமே தீர்க்கிறான்.\" — திருமூலர்", "tags": ["சக்கர நாற்காலி", "நடை", "சிர்டி", "அற்புதம்", "குணம்"]}, {"id": 94, "title": "விமான சீட் கிடைத்தது", "category": "அன்றாட வாழ்க்கை", "story": "சென்னை விமான நிலையத்தில் நவீன் அவசர மருத்துவ தேவைக்கு பயணம். அனைத்து சீட்களும் நிரம்பியிருந்தன. 'பாபா, அவசரம்' என்று வேண்டினான். ஒருவர் கடைசி நிமிடத்தில் ரத்து செய்திருந்தார். சீட் கிடைத்தது. சரியான நேரத்தில் சேர்ந்தான்.", "devotee": "நவீன்", "location": "சென்னை விமான நிலையம்", "tamil_quote": "\"சிறிய நம்பிக்கையும் பெரிய அற்புதம் செய்யும்; சாய் எந்த விஷயத்திலும் சிறியது என்று பார்க்கமாட்டான்.\" — சாய் அருளுரை", "tags": ["விமானம்", "சீட்", "அவசரம்", "ரத்து", "அருள்"]}, {"id": 95, "title": "கூட்டு விரதத்தின் அற்புதம்", "category": "ஆன்மீக அனுபவம்", "story": "அகமதுநகர் கிராமத்தில் 100 பக்தர்கள் 9 வியாழன் கூட்டு விரதம். 9வது வியாழன் கிராமத்தின் பழைய நோயாளிகள் பலர் ஒரே நேரத்தில் குணமடைந்தனர். கிராமத்தில் ஒரு புதிய ஆரோக let currentSearchTerm = '';
let currentModalIndex = 0;
let bgMusicOn = false;
let readingMusicOn = false;

const medAudio = document.getElementById('meditation-audio');
medAudio.volume = 0.45;

/* ════════════════════════════════
   BACKGROUND MUSIC (auto-play)
════════════════════════════════ */
function tryAutoPlay(){
  medAudio.play().then(()=>{
    bgMusicOn = true;
    document.getElementById('music-toggle').textContent = '⏸';
    document.getElementById('music-dot').style.display = 'block';
  }).catch(()=>{});
}
tryAutoPlay();
['touchstart','click','pointerdown'].forEach(ev=>
  document.addEventListener(ev, ()=>{ if(!bgMusicOn) tryAutoPlay(); }, {once:true, passive:true})
);

function toggleBgMusic(){
  if(bgMusicOn){
    medAudio.pause();
    bgMusicOn = false;
    document.getElementById('music-toggle').textContent = '▶';
    document.getElementById('music-dot').style.display = 'none';
  } else {
    medAudio.play().catch(()=>{});
    bgMusicOn = true;
    document.getElementById('music-toggle').textContent = '⏸';
    document.getElementById('music-dot').style.display = 'block';
  }
}

/* Reading music: keep same audio, just show indicator when modal open */
function startReadingMusic(){
  if(!bgMusicOn){
    medAudio.play().catch(()=>{});
    bgMusicOn = true;
    document.getElementById('music-toggle').textContent = '⏸';
    document.getElementById('music-dot').style.display = 'block';
  }
  document.getElementById('reading-music-bar').classList.add('visible');
  readingMusicOn = true;
}

function stopReadingMusic(){
  document.getElementById('reading-music-bar').classList.remove('visible');
  // Fade out after reading
  const startVol = medAudio.volume;
  let vol = startVol;
  const fade = setInterval(()=>{
    vol = Math.max(0, vol - 0.05);
    medAudio.volume = vol;
    if(vol <= 0){
      clearInterval(fade);
      medAudio.pause();
      bgMusicOn = false;
      medAudio.volume = startVol;
      document.getElementById('music-toggle').textContent = '▶';
      document.getElementById('music-dot').style.display = 'none';
    }
  }, 80);
  readingMusicOn = false;
}

/* ════════════════════════════════
   CATEGORIES
════════════════════════════════ */
function buildCategories(){
  const scroll = document.getElementById('cat-scroll');
  DATA.categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.textContent = cat;
    btn.onclick = () => setCategory(cat, btn);
    scroll.appendChild(btn);
  });
}

function setCategory(cat, el){
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  filterStories();
}

/* ════════════════════════════════
   SEARCH & FILTER
════════════════════════════════ */
function filterStories(){
  currentSearchTerm = document.getElementById('search-input').value.trim().toLowerCase();
  filteredStories = ALL_STORIES.filter(s => {
    const matchCat = currentCategory === 'அனைத்தும்' || s.category === currentCategory;
    if(!matchCat) return false;
    if(!currentSearchTerm) return true;
    return (
      s.title.toLowerCase().includes(currentSearchTerm) ||
      s.story.toLowerCase().includes(currentSearchTerm) ||
      s.location.toLowerCase().includes(currentSearchTerm) ||
      s.devotee.toLowerCase().includes(currentSearchTerm) ||
      s.tags.some(t => t.toLowerCase().includes(currentSearchTerm))
    );
  });
  renderStories();
}

/* ════════════════════════════════
   RENDER STORIES
════════════════════════════════ */
function renderStories(){
  const container = document.getElementById('stories-container');
  const empty = document.getElementById('empty-state');
  const info = document.getElementById('results-info');

  container.innerHTML = '';

  if(!filteredStories.length){
    empty.style.display = 'block';
    info.textContent = '';
    return;
  }
  empty.style.display = 'none';
  info.textContent = `${filteredStories.length} கதைகள் காட்டப்படுகின்றன`;

  filteredStories.forEach((story, i) => {
    const card = createCard(story, i);
    container.appendChild(card);
    // Staggered entrance animation
    setTimeout(() => card.classList.add('card-enter'), i * 35);
  });
}

const CATEGORY_ICONS = {
  'உடல் நலம்':'💊','உயிர் காத்தல்':'🙏','வாழ்க்கை அற்புதம்':'✨',
  'குடும்ப வாழ்க்கை':'👨‍👩‍👧','கல்வி':'📚','இயற்கை அற்புதம்':'🌧️',
  'ஆன்மீக அனுபவம்':'🕯️','அன்றாட வாழ்க்கை':'🌼','உளவியல் குணம்':'🌿',
  'சேவை அற்புதம்':'❤️'
};

function createCard(story, idx){
  const card = document.createElement('div');
  card.className = 'story-card';
  card.style.setProperty('--cd', (idx * 0.4) + 's');
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-label', story.title);

  const icon = CATEGORY_ICONS[story.category] || '🪔';
  const preview = story.story.slice(0, 120) + '...';
  const tagsHtml = story.tags.slice(0,3).map(t => `<span class="tag">${t}</span>`).join('');

  card.innerHTML = `
    <div class="card-cat">
      <span class="cat-tag">${icon} ${story.category}</span>
      <span class="card-num">#${story.id}</span>
    </div>
    <div class="card-title">${story.title}</div>
    <div class="card-preview">${preview}</div>
    <div class="card-divider"></div>
    <div class="card-meta">
      <span class="meta-loc">📍 ${story.location}</span>
      <span class="meta-read">படிக்க →</span>
    </div>
    <div class="card-tags">${tagsHtml}</div>
  `;

  card.onclick = () => openModal(idx);
  card.onkeydown = e => { if(e.key === 'Enter' || e.key === ' ') openModal(idx); };
  return card;
}

/* ════════════════════════════════
   MODAL — STORY READER
════════════════════════════════ */
function openModal(filteredIdx){
  currentModalIndex = filteredIdx;
  renderModal(filteredStories[filteredIdx]);
  document.getElementById('story-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('modal-body').scrollTop = 0;
  document.getElementById('modal-progress-bar').style.width = '0%';
  startReadingMusic();
  spawnPetals();
}

function closeModal(){
  document.getElementById('story-modal').classList.remove('open');
  document.body.style.overflow = '';
  stopReadingMusic();
}

function renderModal(story){
  const icon = CATEGORY_ICONS[story.category] || '🪔';
  document.getElementById('modal-cat-tag').textContent = icon + ' ' + story.category;
  document.getElementById('modal-title').textContent = story.title;
  document.getElementById('modal-loc').innerHTML = '📍 ' + story.location;
  document.getElementById('modal-dev').innerHTML = '🙏 ' + story.devotee;
  document.getElementById('modal-story-text').textContent = story.story;
  document.getElementById('modal-quote-text').textContent = story.tamil_quote;

  // Nav buttons
  document.getElementById('prev-btn').disabled = currentModalIndex <= 0;
  document.getElementById('next-btn').disabled = currentModalIndex >= filteredStories.length - 1;
}

function navigateStory(dir){
  const newIdx = currentModalIndex + dir;
  if(newIdx < 0 || newIdx >= filteredStories.length) return;
  currentModalIndex = newIdx;
  renderModal(filteredStories[newIdx]);
  document.getElementById('modal-body').scrollTop = 0;
  document.getElementById('modal-progress-bar').style.width = '0%';
  spawnPetals();
}

function updateReadProgress(){
  const body = document.getElementById('modal-body');
  const pct = (body.scrollTop / (body.scrollHeight - body.clientHeight)) * 100;
  document.getElementById('modal-progress-bar').style.width = Math.min(pct, 100) + '%';
}

/* ════════════════════════════════
   FLOATING PETALS (on modal open)
════════════════════════════════ */
const PETALS = ['🌸','🌺','🌹','🌼','🌻'];
function spawnPetals(){
  for(let i = 0; i < 8; i++){
    setTimeout(()=>{
      const el = document.createElement('div');
      el.className = 'float-petal';
      el.textContent = PETALS[Math.floor(Math.random()*PETALS.length)];
      el.style.left = Math.random()*100 + 'vw';
      el.style.top = '-30px';
      el.style.fontSize = (12 + Math.random()*14) + 'px';
      const dur = 4 + Math.random()*3;
      el.style.animationDuration = dur + 's';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), dur*1000);
    }, i*150);
  }
}

/* ════════════════════════════════
   BACKGROUND PARTICLE CANVAS
════════════════════════════════ */
const bgC = document.getElementById('bg-canvas');
const bgX = bgC.getContext('2d');
function resizeBg(){ bgC.width=innerWidth; bgC.height=innerHeight; }
resizeBg(); window.addEventListener('resize', resizeBg);

class Particle{
  constructor(){this.reset(true);}
  reset(rand){
    this.x = Math.random()*bgC.width;
    this.y = rand ? Math.random()*bgC.height : bgC.height+10;
    this.vx = (Math.random()-.5)*.3;
    this.vy = -(0.18+Math.random()*.45);
    this.r = 0.5+Math.random()*1.6;
    this.life = 1; this.decay = 0.0012+Math.random()*.0028;
    this.tw = Math.random()*Math.PI*2;
    this.star = Math.random()<.25;
  }
  update(){
    this.x+=this.vx; this.y+=this.vy;
    this.life-=this.decay; this.tw+=.06;
    if(this.life<=0||this.y<-10) this.reset(false);
  }
  draw(){
    const tw = Math.sin(this.tw)*.4+.6;
    const a = this.life*tw*.45;
    if(!this.star){
      bgX.shadowBlur=4; bgX.shadowColor='rgba(255,210,0,.6)';
      bgX.fillStyle=`rgba(255,210,55,${a})`;
      bgX.beginPath(); bgX.arc(this.x,this.y,this.r,0,Math.PI*2); bgX.fill();
    } else {
      bgX.shadowBlur=8; bgX.shadowColor='rgba(255,240,180,.8)';
      bgX.fillStyle=`rgba(255,242,185,${a*.85})`;
      bgX.save(); bgX.translate(this.x,this.y); bgX.beginPath();
      for(let i=0;i<8;i++){
        const ag=(i/8)*Math.PI*2, rr=i%2===0?this.r*2.2:this.r*.4;
        i===0?bgX.moveTo(Math.cos(ag)*rr,Math.sin(ag)*rr):bgX.lineTo(Math.cos(ag)*rr,Math.sin(ag)*rr);
      }
      bgX.closePath(); bgX.fill(); bgX.restore();
    }
    bgX.shadowBlur=0;
  }
}

class LightRay{
  constructor(){this.init();}
  init(){
    this.cx=bgC.width*(.3+Math.random()*.4);
    this.ang=-Math.PI/2+(Math.random()-.5)*.7;
    this.len=bgC.height*(.5+Math.random()*.5);
    this.w=25+Math.random()*65;
    this.ph=Math.random()*Math.PI*2;
    this.sp=0.003+Math.random()*.004;
  }
  update(){this.ph+=this.sp;}
  draw(){
    const op=0.008+Math.abs(Math.sin(this.ph))*.018;
    const ex=this.cx+Math.cos(this.ang)*this.len,ey=Math.sin(this.ang)*this.len;
    const g=bgX.createLinearGradient(this.cx,0,ex,ey);
    g.addColorStop(0,`rgba(255,215,0,${op})`); g.addColorStop(1,'rgba(255,200,80,0)');
    bgX.save(); bgX.translate(this.cx,0); bgX.rotate(this.ang+Math.PI/2);
    bgX.beginPath();
    bgX.moveTo(-this.w/2,0); bgX.lineTo(this.w/2,0);
    bgX.lineTo(this.w*.33,this.len); bgX.lineTo(-this.w*.33,this.len);
    bgX.closePath(); bgX.fillStyle=g; bgX.fill(); bgX.restore();
  }
}

const particles = Array.from({length:55},()=>new Particle());
const rays = Array.from({length:3},()=>new LightRay());

function bgLoop(){
  bgX.clearRect(0,0,bgC.width,bgC.height);
  rays.forEach(r=>{r.update();r.draw();});
  particles.forEach(p=>{p.update();p.draw();});
  requestAnimationFrame(bgLoop);
}
bgLoop();

/* ════════════════════════════════
   SCROLL TO TOP VISIBILITY
════════════════════════════════ */
window.addEventListener('scroll',()=>{
  const btn = document.getElementById('scroll-top');
  btn.classList.toggle('visible', window.scrollY > 400);
},{passive:true});

/* ════════════════════════════════
   KEYBOARD NAVIGATION
════════════════════════════════ */
document.addEventListener('keydown', e => {
  const modal = document.getElementById('story-modal');
  if(!modal.classList.contains('open')) return;
  if(e.key==='Escape') closeModal();
  if(e.key==='ArrowRight'||e.key==='ArrowDown') navigateStory(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') navigateStory(-1);
});

/* ════════════════════════════════
   INIT
════════════════════════════════ */
buildCategories();
filterStories();

console.log('சாயின் அற்புத கதைகள் — Om Sai Ram 🙏');
</script>
